[project]
name = "tsb-tui"
version = "0.0.0"
requires-python = ">=3.12"
description = "TSB tui — own manifest so this directory can leave by subtree split"
# tsb-contract (tsb_contract_client, tsbc) is a real runtime dependency but is not listed here:
# PEP 508 cannot express a path relative to this file, and contract/ is not published to an
# index. It ships in contract/ (copied from the program submodule); CI's test job does not install it
# at all — tests import it from contract/ directly (tests/conftest.py,
# .github/workflows/test.yml). `pipx install ./tui` needs a second command to put the contract
# client in the same venv, from a throwaway copy of contract/ — see README.md
# "Install".
dependencies = [
    "textual==8.2.8",
    # The vault's untrusted-mode unlock (E4 phase 12): argon2id, and RFC 8265's OpaqueString profile for the passphrase's
    # bytes. Each at an exact pin, the pins harness/requirements.txt carries; no other crypto library (import-lint).
    "argon2-cffi==25.1.0",
    "precis-i18n==1.1.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "PyYAML==6.0.2", "setuptools==84.2.1"]

[project.scripts]
tsb-tui = "tsb_tui.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tsb_tui*"]

[tool.setuptools.package-data]
tsb_tui = [
    "config_default.toml",
    "drive/GUIDE.md",
    "schemes/*.json",
    "schemes/THIRD_PARTY_SCHEMES.md",
    "themes/*.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rsx"

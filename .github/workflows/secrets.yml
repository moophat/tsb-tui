# CI backstop for secret scanning. The local pre-commit hook is opt-in per checkout and can be
# skipped by a machine that never ran `pre-commit install`; this job cannot. Same .gitleaks.toml.
#
# Jobs run only on the self-hosted CI node (labels self-hosted, tsb-tui-ci); there is no GitHub-hosted fallback.
name: secrets

on:
  push:
    branches: [main]
  pull_request:

# The action reads the PR's commit list and writes a summary comment on a finding.
# Without these, the default GITHUB_TOKEN is read-only on pull_request events and the
# job dies with 403 "Resource not accessible by integration" — a broken gate that
# looks like a failing scan. Verified on tsb-core PR #1, 2026-09-13.
permissions:
  contents: read
  pull-requests: write

# A newer push to a PR cancels its superseded in-progress run. On main, a running job is never
# cancelled; a run still pending when a newer commit queues is replaced by it (GitHub keeps one
# pending run per group), so the newest commit on main always gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: [self-hosted, tsb-tui-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.24.3

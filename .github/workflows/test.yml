      - name: Initialize and check the program pin
        run: |
          set -euo pipefail
          docker run --rm \
            --name tui-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-pin \
            --user "$(id -u):$(id -g)" -v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro -e HOME=/tmp/home \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            ci-tui-py bash -euo pipefail -c 'make contract-init && make contract-check CONTRACT_MAIN_REF=origin/main'

      - name: Lint and repository guards
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          TSB_LEAK_PATTERN: ${{ secrets.TSB_LEAK_PATTERN }}
        run: |
          set -euo pipefail
          docker run --rm \
            --name tui-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-lint \
            --user "$(id -u):$(id -g)" -v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro -e HOME=/tmp/home \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e CI -e GITHUB_EVENT_NAME -e HEAD_REF -e BASE_REF -e TSB_LEAK_PATTERN \
            ci-tui-py make lint

      - name: Remove this job's containers
        if: always()
        run: |
          docker rm -f tui-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-fetch || true
          docker rm -f tui-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-pin || true
          docker rm -f tui-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-lint || true


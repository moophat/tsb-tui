              mkdir -p program
              find program -mindepth 1 -delete
              rm -rf "$(git rev-parse --git-dir)/modules/contract"
              git submodule init program
              git clone --filter=blob:none --no-checkout --sparse https://github.com/moophat/tsb-program.git program
              git -C program sparse-checkout set --cone srs contract
              git -C program checkout --detach "$sha"
              git -C program fetch origin +refs/heads/main:refs/remotes/origin/main --tags

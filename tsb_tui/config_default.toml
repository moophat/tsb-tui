# tsb-tui: the packaged default configuration (design-261010-tui-config-default.toml, revision 4,
# built at E2). Every value is a knob with a default; the TUI's own config.py reads this file.
#
# Order of precedence, lowest first (design D30):
#   these defaults < a profile < config file < TSB_TUI_* < --set key=value.
# The config file is beside the program (TSB_TUI_HOME) if present, else the OS default; --config wins.
#
# Your own config file holds only the keys you change, not a copy of this file: every key in your file
# overrides the profile, so a copied `size.auto_request = true` would undo the phone, drive and harness
# profiles' OPEN-1 value (false). A `[profiles.*]` table here is refused at start-up — profiles are this
# packaged file's, not yours.
#
# Changes from the design's knob file, per plans/261011-1000-e2-tui/phase-02-config-and-model.md:
#   * size.auto_request is true in the default profile: the operator ruled OPEN-1 on 2026-10-12, and
#     §4's "on by default for … the TUI" wins for this client. The phone, drive and harness profiles
#     keep it false (§4's phone line, and drive acts on nothing, D53). Nothing is left unset.
#   * drive.guard is renamed input.guard (the guard is the person's too, Frontend §9); default true.
#     D52 is also ruled (2026-10-12): the harness profile keeps the guard on like every other profile.
#   * new keys: term.library, term.scrollback_bytes, input.focus_reports, alerts.read_timeout_s,
#     broker.timeout_s; the drive profile sets sidebar.start_filter = "all" (DT15).
#   * event_log.lines bounds the per-attachment event log (D22); the design's knob file carried no
#     bound, so phase 2 adds one and owns it.
#
# Nothing here reaches the broker. Size requests and keyboard moves are made by the operator, never
# by config. What the broker lets a principal see is not a knob.

profile = "default"                # "default", "phone", "drive" or "harness"

[theme]
name = "nord"
bg          = "#0a0a0a"
surface     = "#1f1f1f"
surface_2   = "#222222"
surface_3   = "#2a2a2a"
border      = "#919191"
border_on_surface = "#919191"
text        = "#ededed"
text_muted  = "#a3a3a3"
text_faint  = "#919191"   # fallback role meets the P1 chrome contrast floor
accent      = "#e56d4d"
accent_hot  = "#ff570a"
accent_soft = "#311b16"
on_accent   = "#0a0a0a"
steel       = "#7aa7d6"
ok          = "#7fc27f"
warn        = "#e5b34a"
danger      = "#ff5c7a"
frame       = "#919191"   # neutral dialog frame, with chrome contrast
rec         = "#ff5c7a"   # the status row's ● REC
rec_list    = "#a3a3a3"   # REC on sidebar and fleet rows

[theme.term]
palette  = "theme"
# The canvas background: "scheme" takes the selected scheme's background; "outer" keeps the
# terminal's own background (see-through); a #rrggbb hex is painted as given.
bg       = "scheme"
# Default foreground: "" means the selected scheme's foreground (or, under palette="outer",
# the outer terminal's own default); a hex overrides it.
fg       = ""
cursor_typist = "block"
cursor_viewer = "underline"
# Cursor colours: "role" uses TSB's accent/steel/on_accent roles (the default, ruling 6);
# "scheme" uses the selected scheme's cursor/cursorText colours.
cursor_colour = "role"
# The terminal colour scheme: a file stem under tsb_tui/schemes/ (packaged) or
# $XDG_CONFIG_HOME/tsb-tui/schemes/ (user). "tsb-default" is TSB's own palette.
scheme = "tsb-default"
# 16 ANSI colours: [] means "the scheme's"; a list of exactly 16 hex colours overrides.
colors = []
# Minimum contrast (B7, ruling 4): 1.0 is off — a target's colours are shown faithfully. Above 1.0
# lifts a foreground toward white or black until it meets this WCAG ratio against its background.
minimum_contrast = 1.0

[glyphs]
set = "unicode"

[term]
# DT2: the explicit path to libghostty-vt.so. Empty falls back to
# <sys.prefix>/lib/tsb-tui/libghostty-vt.so (phase 3 wires the lookup).
library = ""
# DT18: the engine's scrollback, the C4 goldens' value.
scrollback_bytes = 4194304

[rail]
side  = "left"
width = 4
phone = "full"
chips = ["open_here", "mine_held_by_others"]
chip_mark = ["front", "unseen_output"]
needs_you = ["question_for_me", "stale_and_i_type", "ending_window", "unreachable"]
needs_you_scope = "mine_or_open_here"

[sidebar]
width = 32
width_phone = 30
width_wide = 42
wide_from = 160
groups = ["needs_you", "open_here", "mine_held_by_others", "mine_and_joinable"]
start_filter = "mine"
details_from = 160
# Accepted for existing config files; picking a session now preserves the sidebar in every mode.
close_on_pick = "phone"
open_when_no_session = true

[fleet_view]
tabs = ["sessions", "targets", "alerts"]
group_by = "none"
show_ended = false
details_from = 160
refresh_s = 5

[status]
show = true
position = "bottom"
hint_priority = ["menu", "answer", "take_back", "fleet", "who", "detach", "end", "size", "scroll", "inspector", "keys"]
keys_indicator = true
# The stale notice banner at the top of the canvas (stale-screen rule 18): its text colour, its
# background, and the blank cells kept at each side of the text.
stale_banner_fg = "#0a0a0a"
stale_banner_bg = "#e5b34a"
stale_banner_pad = 1

[menu]
search = true
# Accepted for existing config files; the menu now opens immediately and waits without a timeout.
open_on_leader_after_ms = 300

[mouse]
enabled = true
canvas_clicks = "session_if_asked"
tooltips = true

[keys]
leader = "ctrl+backslash"

[size]
# OPEN-1 was ruled on 2026-10-12: auto size is on by default. The phone, drive and harness profiles
# override it to false.
auto_request = true
debounce_ms = 300

[input]
# DT4 (a): the guard for typed keys and paste. Default on, the harness profile included (D52 was
# ruled on 2026-10-12: the guard stays on everywhere).
guard = true
# DT4 (b): focus reports are off by default, because each is input that counts as E1.
focus_reports = false

[view]
chrome = "auto"
narrow_mode = "pan"
follow_cursor = "auto"
pan_step = 8
inspector = "auto"

[scroll]
# Rows one wheel turn moves the scroll view.
wheel_lines = 3
# How the search in the scroll view marks what it found, as Rich style strings. They are attributes, not colours, so
# they read on every theme. The current match is the one `n` and `N` stand on.
match_style = "underline"
current_match_style = "reverse bold"
# How the lines selected in the scroll view are marked (a Rich style string).
selection_style = "reverse"

[copy]
# Copy from the scroll view: one OSC 52 write to the outer terminal, which puts the text on the operator's clipboard.
# The terminal (and tmux: `set -g set-clipboard on`) must allow it. false: nothing is written, and `y` says so.
osc52 = true
# Most bytes of text (before base64) one copy sends. A selection over it is refused whole, never cut.
max_bytes = 100000
# A selected row that the session's output wrapped into the next selected row runs on into it, with no newline.
join_wrapped = true

[render]
# 60: an echo waits at most one paint tick (16 ms) for the next frame; 30 left keystroke-to-screen
# over its gate on large windows.
max_fps = 60
paint_background = false

[sessions]
id_min_hex = 6

[watch]
held = "manual"
take_back_brings_to_front = true

[prompts]
input_guard_ms = 1000
capture_unblocking = false

[gates]
recording = "first-attach"
recording_bar_s = 5
hostkey_tick = true

[reattach]
auto = true
backoff_ms = [500, 1000, 2000, 5000, 10000, 30000]

[update]
check = true
interval_h = 24
url = ""

[broker]
# The core base URL when --broker is absent; empty means no address configured.
url = ""
# How long every REST call to the core may take, POST /sessions included. A create can take the
# core's connect bound (30 s) plus a target's open bound plus one heartbeat interval: 55 s with the
# deploy templates' defaults. 70 s waits for the core's own answer and stays under nginx's 90 s
# /sessions read timeout. The contract client's own default is 10 s. The same value bounds an
# attach's connect and its wait for `attached`: a TUI attach to a core that is up but hung waits up
# to this long, where it waited 10 s.
timeout_s = 70

[alerts]
popup = true
# DT14: above the core's 10 s comment cadence.
read_timeout_s = 30

[toasts]
seconds = 5
max = 3

[motion]
level = "basic"

[event_log]
# D22: the per-attachment event log is client-side only; this bounds it.
lines = 2000

[drive]
send_gate = true
brake_look_max_ms = 10000
default_cols = 120
default_rows = 40
answer_timeout_ms = 30000
wait_timeout_ms = 30000
wait_timeout_max_ms = 600000
settled_ms = 800
reply_max_lines = 5000
events = ["gate", "token", "input_refused", "clients", "stale", "notice", "size", "ended", "removed", "detached", "device_login_hostkey", "device_login_prompt", "device_login_result", "request_refused"]
output_events = "off"
switch_on_action = true

[profiles.phone]
size.auto_request = false
view.chrome = "compact"
view.follow_cursor = "on"
fleet_view.refresh_s = 10

[profiles.drive]
update.check = false
# B8, TT19: drive and the rigs always see the packaged look. These pins name it outright, so a saved
# choice, a config file or the environment can never move the look a rig's text snapshot was built on;
# drive never reads the state file.
theme.name = "terracotta"
theme.term.scheme = "tsb-default"
size.auto_request = false
mouse.enabled = false
motion.level = "none"
# DT15: the drive profile starts the sidebar filter at all.
sidebar.start_filter = "all"

[profiles.harness]
update.check = false
# B8, TT19: the same pins as drive — every rig renders the packaged look, and no person's saved
# choice reaches a rig's snapshot.
theme.name = "terracotta"
theme.term.scheme = "tsb-default"
size.auto_request = false
motion.level = "none"
drive.output_events = "counts"
# D52 was ruled on 2026-10-12: the input guard stays on here too, so a rig's typing is refused
# locally exactly as a person's is, and the profile says so rather than inheriting it silently.

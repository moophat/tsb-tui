# Chrome theme "dracula" — the chrome in Dracula's palette (dracula/dracula-theme, MIT), beside the Dracula scheme.
# "You type" is Dracula's pink, "another login" its cyan, focus its orange.
[theme]
name = "dracula"
variant = "dark"
scheme = "dracula"
bg          = "#282a36"
surface     = "#1f2029"
surface_2   = "#343746"
surface_3   = "#424450"
border      = "#44475a"
border_on_surface = "#4d5066"
text        = "#f8f8f2"
text_muted  = "#c3c6dc"
text_faint  = "#9aa0c0"
accent      = "#ff79c6"
accent_hot  = "#ffb86c"
accent_soft = "#4b2c45"
on_accent   = "#1f2029"
steel       = "#8be9fd"
ok          = "#50fa7b"
warn        = "#f1fa8c"
danger      = "#ff5555"
frame       = "#6272a4"
rec         = "#ff5555"
rec_list    = "#c3c6dc"

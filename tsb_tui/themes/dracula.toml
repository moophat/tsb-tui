# Chrome theme "dracula" — the chrome in Dracula's palette (dracula/dracula-theme, MIT), beside the Dracula scheme.
# "You type" is Dracula's pink, "another login" its cyan, focus its orange.
[theme]
name = "dracula"
variant = "dark"
scheme = "dracula"
bg          = "#282a36"
surface     = "#343746"
surface_2   = "#343746"
surface_3   = "#424450"
border      = "#aeb0c2"
border_on_surface = "#aeb0c2"
text        = "#f8f8f2"
text_muted  = "#c3c6dc"
text_faint  = "#abb0ca"
accent      = "#ff8bcd"
accent_hot  = "#ffb86c"
accent_soft = "#4b2c45"
on_accent   = "#1f2029"
steel       = "#8be9fd"
ok          = "#50fa7b"
warn        = "#f1fa8c"
danger      = "#ff9393"
frame       = "#a8b1cc"
rec         = "#ff9393"
rec_list    = "#c3c6dc"

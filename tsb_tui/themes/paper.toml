# Chrome theme "paper" — light, for a phone in a bright aisle. Surfaces from 9remote's light tokens
# (globals.css :359-363), warmed and stepped so the chrome still separates from a light canvas; the accent is the
# terracotta darkened until it holds 4.5:1 on the light surfaces.
[theme]
name = "paper"
variant = "light"
scheme = "solarized-light"
bg          = "#fcfbf9"
surface     = "#ece6da"
surface_2   = "#e4e0da"
surface_3   = "#d9d4cd"
border      = "#655b4e"
border_on_surface = "#645b51"
text        = "#1c1b1a"
text_muted  = "#4f4b46"
text_faint  = "#605c56"
accent      = "#9f3c26"
accent_hot  = "#a5370a"
accent_soft = "#f4d9cf"
on_accent   = "#ffffff"
steel       = "#2c5d8f"
ok          = "#2a6833"
warn        = "#865000"
danger      = "#b0203f"
frame       = "#615b54"
rec         = "#b0203f"
rec_list    = "#4f4b46"

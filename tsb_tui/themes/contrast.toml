# Chrome theme "contrast" — high contrast for a small phone font and for low vision (iTerm2 ships
# "Dark High Contrast" and "Light High Contrast" for the same reason). Every text role is 7:1 or more on its surface.
[theme]
name = "contrast"
variant = "dark"
scheme = "tsb-default"
bg          = "#000000"
surface     = "#141414"
surface_2   = "#262626"
surface_3   = "#333333"
border      = "#6e6e6e"
border_on_surface = "#7a7a7a"
text        = "#ffffff"
text_muted  = "#d4d4d4"
text_faint  = "#b3b3b3"
accent      = "#ff7f57"
accent_hot  = "#ffa64d"
accent_soft = "#4a2216"
on_accent   = "#000000"
steel       = "#8fc6ff"
ok          = "#7dff8a"
warn        = "#ffd23f"
danger      = "#ff7092"
frame       = "#9a9a9a"
rec         = "#ff7092"
rec_list    = "#d4d4d4"

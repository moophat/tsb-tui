# Chrome theme "nord" — the chrome in Nord's own palette (nordtheme/nord, MIT), to sit beside the Nord scheme.
# The roles keep TSB's meanings: "you type" is Nord's aurora orange, "another login" its frost cyan, so the two
# never share a hue. The chrome sits darker than the canvas (nord0), as Nord's own editor sidebars do, so the
# aurora colours keep 4.5:1 on it.
[theme]
name = "nord"
variant = "dark"
scheme = "nord"
bg          = "#2e3440"
surface     = "#252a33"
surface_2   = "#3b4252"
surface_3   = "#434c5e"
border      = "#3b4252"
border_on_surface = "#4c566a"
text        = "#eceff4"
text_muted  = "#cdd3de"
text_faint  = "#aab3c3"
accent      = "#d08770"
accent_hot  = "#ebcb8b"
accent_soft = "#4f4549"
on_accent   = "#1f232b"
steel       = "#88c0d0"
ok          = "#a3be8c"
warn        = "#ebcb8b"
danger      = "#e0848c"
frame       = "#6b7891"
rec         = "#e0848c"
rec_list    = "#cdd3de"

# Chrome theme "nord" — palette from nordtheme/nord (MIT).
# Frost is the default accent (P1 O7); terracotta remains selectable.
# Surface is the computed minimum HSL-lightness step from bg reaching 1.2:1.
# Supporting surfaces and text roles retain at least 4.5:1 chrome contrast.
[theme]
name = "nord"
variant = "dark"
scheme = "nord"
bg          = "#2e3440"
surface     = "#39404f"
surface_2   = "#3b4252"
surface_3   = "#41495b"
border      = "#b1b8c7"
border_on_surface = "#b0b8c6"
text        = "#eceff4"
text_muted  = "#cdd3de"
text_faint  = "#b4bcca"
accent      = "#88c0d0"
accent_hot  = "#ebcb8b"
accent_soft = "#4f4549"
on_accent   = "#1f232b"
steel       = "#8fc4d3"
ok          = "#abc395"
warn        = "#ebcb8b"
danger      = "#eaabb1"
frame       = "#b0b8c5"
rec         = "#eaabb1"
rec_list    = "#cdd3de"
